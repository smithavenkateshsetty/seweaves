<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeWeaves</title>
<link rel="stylesheet" href="/styles.css">
<style>
.detail{display:grid;grid-template-columns:1.45fr .95fr;gap:clamp(26px,3.5vw,52px);align-items:start}
@media(max-width:980px){.detail{grid-template-columns:1fr}}

/* --- gallery: thumbnail rail + stage, Amazon-style --- */
.gallery{display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:start}
@media(max-width:600px){.gallery{grid-template-columns:1fr}}

.rail{display:flex;flex-direction:column;gap:10px;max-height:760px;overflow-y:auto;scrollbar-width:thin}
@media(max-width:600px){
  .rail{flex-direction:row;order:2;overflow-x:auto;max-height:none;padding-bottom:4px}
}
.rail button{flex:none;width:86px;height:114px;padding:0;cursor:pointer;overflow:hidden;
  background:var(--oxblood-deep);border:1px solid rgba(201,162,87,.35);transition:border-color .2s,opacity .2s;opacity:.75}
.rail button:hover{opacity:1;border-color:rgba(201,162,87,.7)}
.rail button[aria-current="true"]{border-color:var(--gold-bright);opacity:1}
.rail img{width:100%;height:100%;object-fit:cover}

.stage{position:relative;border:var(--frame);overflow:hidden;background:var(--oxblood-deep);
  aspect-ratio:3/4;touch-action:pan-y}
.stage img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .18s ease-out;transform-origin:center}
.stage.zooming img{transition:none}
.stage .noshot{width:100%;height:100%;display:grid;place-items:center;color:var(--gold);opacity:.4;
  font-family:var(--engraved);font-size:.62rem;letter-spacing:.2em}

.stage .arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:52px;
  background:rgba(51,9,14,.78);border:1px solid rgba(201,162,87,.5);color:var(--gold-bright);
  font-size:1.2rem;cursor:pointer;opacity:0;transition:opacity .2s;z-index:2;line-height:1}
.stage:hover .arrow,.stage:focus-within .arrow{opacity:1}
@media(hover:none){.stage .arrow{opacity:1}}
.stage .arrow.prev{left:0}
.stage .arrow.next{right:0}
.stage .arrow:hover{background:var(--gold-bright);color:var(--oxblood-deep)}

.stage .counter{position:absolute;bottom:10px;right:10px;z-index:2;
  font-family:var(--engraved);font-size:.55rem;letter-spacing:.16em;
  background:rgba(51,9,14,.82);border:1px solid rgba(201,162,87,.45);
  color:var(--ivory);padding:5px 10px}
.zoomhint{position:absolute;bottom:10px;left:10px;z-index:2;font-family:var(--engraved);
  font-size:.5rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ivory-dim);
  background:rgba(51,9,14,.82);border:1px solid rgba(201,162,87,.35);padding:5px 9px;
  opacity:0;transition:opacity .25s;pointer-events:none}
.stage:hover .zoomhint{opacity:1}
@media(hover:none){.zoomhint{display:none}}

/* --- fullscreen zoom viewer --- */
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(16,3,5,.97);display:none;
  flex-direction:column}
.lightbox.open{display:flex}
.lbstage{
  flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;
  cursor:zoom-in;touch-action:none;position:relative;
}
.lbstage.zoomed{cursor:grab}
.lbstage.dragging{cursor:grabbing}
.lbstage img{
  max-width:100%;max-height:100%;object-fit:contain;
  transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none;
}
.lbbar{
  display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding:14px 18px;border-top:1px solid rgba(201,162,87,.3);
}
.lbbar button{
  background:transparent;border:1px solid var(--gold);color:var(--gold-bright);
  font-family:var(--engraved);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
  padding:9px 15px;cursor:pointer;
}
.lbbar button:hover{background:rgba(201,162,87,.2)}
.lbbar .zoomlvl{
  font-family:var(--engraved);font-size:.6rem;letter-spacing:.14em;color:var(--ivory-dim);
  min-width:52px;text-align:center;
}
.lightbox .close{
  position:absolute;top:14px;right:16px;z-index:3;font-size:1.5rem;line-height:1;
  padding:5px 13px;background:rgba(16,3,5,.8);
}
.lbhint{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:2;
  font-family:var(--engraved);font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ivory-dim);background:rgba(16,3,5,.75);padding:7px 13px;
  border:1px solid rgba(201,162,87,.3);pointer-events:none;
  transition:opacity .4s;
}
.lbhint.gone{opacity:0}

.specs{list-style:none;padding:0;margin:26px 0;border-top:1px solid rgba(201,162,87,.3)}
.specs li{display:flex;justify-content:space-between;gap:20px;padding:12px 0;
  border-bottom:1px solid rgba(201,162,87,.3)}
.specs .k{font-family:var(--engraved);font-size:.6rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold);flex:none}
.specs .v{text-align:right}
.bigprice{font-family:var(--display);font-size:clamp(1.8rem,4vw,2.4rem);color:var(--gold-bright)}
.review{border-left:1px solid rgba(201,162,87,.4);padding:4px 0 4px 16px;margin-bottom:22px}
.review h5{margin:0 0 3px;font-size:1rem;font-weight:500}
</style>
</head>
<body>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">

  <div class="lbbar">
    <button id="lbPrev">Previous</button>
    <button id="lbOut" aria-label="Zoom out">−</button>
    <span class="zoomlvl" id="lbLevel">100%</span>

    <button id="lbFit">Fit</button>

<div class="scrim" id="scrim"></div>

  <div class="foot" id="bagFoot"></div>
</aside>

<script src="/app.js?v=8"></script>
<script src="/product.js?v=8"></script>
<script>
/* Watchdog. If product.js has not rendered within 6 seconds, this inline script
 * — which cannot itself be cached separately or fail to load — works out why. */
window.__swError = null;
window.addEventListener('error', function (e) {
  // A failed <script> gives an Event on the element; a thrown error gives an
  // ErrorEvent with a message. They need telling apart.
  if (e.target && e.target.tagName === 'SCRIPT') {
    window.__swError = 'script failed to load: ' + (e.target.src || '?');
  } else if (e.message) {
    window.__swError = e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '');
  }
}, true);

setTimeout(async function () {
  var root = document.getElementById('detail');
  if (!root || !/Loading/.test(root.textContent)) return;   // rendered fine

  var slug = location.pathname.split('/').filter(Boolean).pop();
  var lines = [];

  lines.push(window.SeWeaves ? 'app.js loaded' : 'app.js did NOT load');
  lines.push(window.__swProductLoaded ? 'product.js ran' : 'product.js did NOT run');
  if (window.__swError) lines.push('error: ' + window.__swError);

  // Is the file even on the server?
  try {
    var f = await fetch('/product.js?probe=1', { cache: 'no-store' });
    var body = await f.text();
    lines.push('product.js file: HTTP ' + f.status + ', ' + body.length + ' bytes');
    if (f.ok && body.length) {
      lines.push(/__swProductLoaded/.test(body)
        ? 'file is the current version'
        : 'file is an OLD version — redeploy public/product.js');
    }
  } catch (err) { lines.push('could not fetch product.js: ' + err.message); }

  try {
    var res = await fetch('/api/products/' + encodeURIComponent(slug));
    lines.push('API returned ' + res.status);
    if (res.ok) { var d = await res.json(); lines.push('data received for "' + d.title + '"'); }
  } catch (err) { lines.push('API call failed: ' + err.message); }

  root.innerHTML =
    '<p class="eyebrow">This piece would not load</p>' +
    '<h1 class="h1">Something is wrong at our end.</h1>' +
    '<p class="lede">Please try again, or message us and we will send you the details.</p>' +
    '<p style="margin-top:24px"><a class="btn" href="/#catalogue">Back to the rail</a></p>' +
    '<pre style="margin-top:30px;color:#CDBBA0;font-size:.8rem;white-space:pre-wrap;' +
    'border-left:2px solid #C9A257;padding-left:14px">' + lines.join('\n') + '</pre>';
}, 6000);
</script>
</body>
</html>
